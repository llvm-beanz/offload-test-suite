DescriptorSets:
  - Resources:
    - Name: InputBuffer
      Kind: StructuredBuffer
      DirectXBinding: { Register: 0, Space: 0 }
      VulkanBinding: { Binding: 0 }
    - Name: ResultBuffer
      Kind: RWStructuredBuffer  
      DirectXBinding: { Register: 0, Space: 0 }
      VulkanBinding: { Binding: 1 }

Results:
  - Result: ForwardADTest
    Rule: BufferFloatULP
    # There are some pretty big rounding errors in some of these, particularly 
    # Test 9 (Complex Expression) which involves multiple operations. 70 ULP is
    # sufficient to account for these while still catching significant errors.
    ULPT: 70
    ZeroTolerance: 1e-6
    Actual: ResultBuffer
    Expected: ExpectedResults

...

# RUN: %dxc_target -T cs_6_6 -E RunAllTests -Fo %t.o %S/ForwardAD_Tests.hlsl
# RUN: %offloader %s %t.o
